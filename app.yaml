runtime: python311
entrypoint: uvicorn app:app --host 0.0.0.0 --port $PORT

env: standard
instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 1

# App Engine will inject these values from your project configuration
# or you can set them directly here for local deployment tuning.
# Store secrets and environment-specific values outside source control.
# Set them in App Engine config, CI/CD secrets, or a local .env file.
env_variables:
  PGHOST: ""
  PGPORT: ""
  PGDATABASE: ""
  PGUSER: ""
  PGSSLMODE: "require"
  DATABASE_ENDPOINT: ""

  DATABRICKS_LLM_ENDPOINT: ""
  DATABRICKS_KNOWLEDGE_ENDPOINT: ""

  GENIE_REGISTRY_TABLE: "public.registry_table"
  GENIE_SESSION_CONTEXT_TABLE: "public.session_context"
  GENIE_CHAT_SESSIONS_TABLE: "public.chat_sessions"
  GENIE_CHAT_MESSAGES_TABLE: "public.chat_messages"
  MAX_SESSIONS_PER_USER: "5"
  GENIE_SKILLS_TABLE: "public.skills"
  MAX_SKILLS_PER_USER: "10"
  GENIE_USAGE_HISTORY_TABLE: "public.usage_history"

  GENIE_BUILDER_WAREHOUSE_ID: ""
  GENIE_BUILDER_PARENT_PATH: ""
  GENIE_BUILDER_SIGNING_SECRET: ""
  GENIE_BUILDER_MAX_TABLES: "500"
  GENIE_TIMEOUT_SECONDS: "300"
  KNOWLEDGE_TIMEOUT_SECONDS: "120"
  MAX_ROUTED_SPACES: "3"

  ATLAN_BASE_URL: ""
  ATLAN_CLIENT_ID: ""
  ATLAN_CLIENT_SECRET: ""

  MLFLOW_TRACKING_URI: ""
  MLFLOW_EXPERIMENT_ID: ""
  LLM_INPUT_PRICE_PER_MILLION: "0"
  LLM_OUTPUT_PRICE_PER_MILLION: "0"

# If you are using Cloud SQL for PostgreSQL, set the instance name in your deployment environment.
# beta_settings:
#   cloud_sql_instances: your-project:region:instance-name
